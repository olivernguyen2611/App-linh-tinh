<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>App linh tinh</title>
<style>
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f6f4ff; color: #22223b; }
  .wrap { max-width: 560px; margin: 0 auto; padding: 24px 16px; }
  h1 { text-align: center; }
  a.app { display: flex; gap: 14px; align-items: center; background: #fff; border-radius: 18px; padding: 16px;
    box-shadow: 0 6px 24px rgba(80,60,180,.10); text-decoration: none; color: inherit; margin-bottom: 12px; }
  .icon { font-size: 2rem; }
  .name { font-weight: 700; }
  .desc { color: #7a7a90; font-size: .9rem; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🧰 App linh tinh</h1>
  <a class="app" href="chon-giup-tui/">
    <span class="icon">🎯</span>
    <span><div class="name">Chọn Giùm Tui</div><div class="desc">Nhập các lựa chọn đang phân vân, quay vòng quay để ra kết quả</div></span>
  </a>
  <a class="app" href="thoi-nen/">
    <span class="icon">🕯️</span>
    <span><div class="name">Thổi Nến Ước Nguyện</div><div class="desc">Thổi vào micro để tắt nến sinh nhật, điều ước bay lên thành vì sao</div></span>
  </a>
</div>
</body>
</html>
