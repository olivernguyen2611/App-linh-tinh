<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Thổi Nến Ước Nguyện</title>
<style>
  :root { --gold: #ffd37a; --ink: #f4efff; --muted: #b9b2d8; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070618; color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #sky { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #glow { position: fixed; inset: 0; pointer-events: none; transition: opacity 1.2s;
    background: radial-gradient(circle at 50% 62%, rgba(255,170,70,.35), rgba(255,140,40,.08) 35%, transparent 60%); }
  #stage { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: flex-end; padding: 16px 16px calc(24px + env(safe-area-inset-bottom));
    transition: transform 2.6s cubic-bezier(.6,0,.3,1), opacity 2s; }
  #stage.up { transform: translateY(70vh); opacity: 0; }
  h1 { margin: 0 0 6px; font-size: clamp(1.4rem, 5vw, 2.2rem); text-align: center; color: var(--gold);
    text-shadow: 0 0 18px rgba(255,200,100,.5); }
  .hint { color: var(--muted); font-size: .95rem; text-align: center; margin: 0 0 14px; min-height: 1.3em; max-width: 420px; }
  .btns { display: flex; gap: 10px; margin: 12px 0 18px; flex-wrap: wrap; justify-content: center; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 999px; padding: 11px 20px; cursor: pointer;
    background: linear-gradient(135deg, #ffcf6b, #ff9a5a); color: #2a1600; box-shadow: 0 6px 20px rgba(255,150,70,.3); }
  button.ghost { background: rgba(255,255,255,.1); color: var(--ink); box-shadow: none; border: 1px solid rgba(255,255,255,.2); }
  button:disabled { opacity: .5; cursor: default; }
  #meter { width: 160px; height: 6px; border-radius: 3px; background: rgba(255,255,255,.12); overflow: hidden; margin-bottom: 14px; visibility: hidden; }
  #meter i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #8fd3ff, #ffd37a, #ff6b6b); transition: width .08s; }

  /* Candle + cake */
  .cake-wrap { position: relative; display: flex; flex-direction: column; align-items: center; cursor: pointer; user-select: none; }
  .flame-box { position: relative; width: 40px; height: 74px; }
  .flame { position: absolute; left: 50%; bottom: 0; width: 26px; height: 62px; margin-left: -13px;
    border-radius: 50% 50% 50% 50% / 62% 62% 38% 38%; transform-origin: 50% 100%;
    background: radial-gradient(ellipse at 50% 78%, #fff 0 18%, #ffe9a0 30%, #ffb43a 55%, rgba(255,90,20,.9) 75%, transparent 100%);
    box-shadow: 0 0 30px 10px rgba(255,170,60,.45), 0 0 80px 30px rgba(255,140,40,.2);
    animation: flicker .12s infinite alternate; transition: opacity .25s, height .25s; }
  .flame::after { content: ""; position: absolute; left: 50%; bottom: 4px; width: 9px; height: 16px; margin-left: -4.5px;
    border-radius: 50%; background: rgba(70,120,255,.65); filter: blur(2px); }
  @keyframes flicker { from { scale: 1 1; } to { scale: .94 1.05; } }
  .out .flame { opacity: 0; height: 10px; }
  .wick { width: 3px; height: 12px; background: #2b2118; margin: 0 auto; border-radius: 2px; }
  .out .wick { background: #111; box-shadow: 0 -2px 4px rgba(255,90,30,.8); animation: ember 2s forwards; }
  @keyframes ember { to { box-shadow: none; } }
  .candle { width: 26px; height: 110px; border-radius: 5px 5px 3px 3px;
    background: repeating-linear-gradient(135deg, #fff 0 10px, #ff7aa8 10px 20px);
    box-shadow: inset -5px 0 8px rgba(0,0,0,.15), inset 4px 0 6px rgba(255,255,255,.5); }
  .cake { width: 230px; height: 88px; margin-top: -2px; border-radius: 14px 14px 8px 8px; position: relative;
    background: linear-gradient(#7a4a33, #5b3322); box-shadow: 0 14px 30px rgba(0,0,0,.5); }
  .cake::before { content: ""; position: absolute; left: -4px; right: -4px; top: -8px; height: 30px; border-radius: 16px;
    background: #fff4f8; box-shadow: 0 4px 0 #ffc6da;
}
  .cake::after { content: ""; position: absolute; left: 0; right: 0; top: 46px; height: 8px; background: #ffc6da; opacity: .7; }
  .plate { width: 280px; height: 14px; border-radius: 50%; background: #d9d4ea; margin-top: -6px; box-shadow: 0 6px 18px rgba(0,0,0,.6); }

  .smoke { position: absolute; left: 50%; bottom: 60px; width: 12px; height: 12px; border-radius: 50%;
    background: rgba(200,200,220,.5); filter: blur(4px); pointer-events: none; animation: smoke 2.2s ease-out forwards; }
  @keyframes smoke { to { transform: translate(var(--dx), -140px) scale(4); opacity: 0; } }

  /* Flying wish */
  .flying { position: fixed; left: 50%; z-index: 5; pointer-events: none; width: 14px; height: 14px;
    border-radius: 50%; background: #fff; box-shadow: 0 0 16px 6px #ffd37a, 0 0 40px 16px rgba(255,154,90,.6);
    transform: translate(-50%, -50%); }

  #final { position: fixed; left: 0; right: 0; bottom: calc(30px + env(safe-area-inset-bottom)); text-align: center;
    padding: 0 16px; opacity: 0; transition: opacity 1.2s; pointer-events: none; }
  #final.show { opacity: 1; pointer-events: auto; }
  #final p { margin: 0 0 14px; font-size: 1.1rem; color: var(--gold); text-shadow: 0 0 14px rgba(255,200,100,.6); }
  a.back { position: fixed; top: 12px; left: 14px; color: var(--muted); text-decoration: none; font-size: .9rem; z-index: 6; }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="glow"></div>
<a class="back" href="../">← App linh tinh</a>

<div id="stage">
  <h1>🎂 Chúc Mừng Sinh Nhật 🎂</h1>
  <p class="hint" id="hint">Nhắm mắt, ước thầm một điều, rồi thổi nến nhé!</p>
  <div class="btns">
    <button id="micBtn">🎤 Bật micro để thổi</button>
  </div>
  <div id="meter"><i></i></div>
  <div class="cake-wrap" id="cake" title="Không có micro? Chạm vào ngọn lửa để thổi">
    <div class="flame-box"><div class="flame" id="flame"></div></div>
    <div class="wick"></div>
    <div class="candle"></div>
    <div class="cake"></div>
    <div class="plate"></div>
  </div>
</div>

<div id="final">
  <p id="finalText">✨ Điều ước đã bay lên trời sao ✨</p>
  <button id="againBtn">🕯️ Thắp nến lại</button>
</div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const sky = $('#sky'), ctx = sky.getContext('2d');
  const stage = $('#stage'), cake = $('#cake'), flame = $('#flame'), hint = $('#hint');
  const meter = $('#meter'), meterBar = $('#meter i'), micBtn = $('#micBtn');
  const final = $('#final'), glow = $('#glow');

  // ---------- Starry sky ----------
  let W, H, dpr, stars = [], wishStars = [], shooting = [];
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = innerWidth; H = innerHeight;
    sky.width = W * dpr; sky.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const n = Math.round(W * H / 2600);
    stars = Array.from({ length: n }, () => ({
      x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.3 + .2,
      p: Math.random() * Math.PI * 2, s: Math.random() * 2 + .5
    }));
  }
  addEventListener('resize', resize); resize();

  let skyLift = 0; // 0 = candle view, 1 = full sky view
  function drawSky(t) {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#05041a');
    g.addColorStop(.6, skyLift > .5 ? '#0b0a2e' : '#120c33');
    g.addColorStop(1, skyLift > .5 ? '#15123f' : '#2a1533');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    for (const s of stars) {
      const a = .35 + .65 * Math.abs(Math.sin(t / 1000 * s.s + s.p));
      // stars drift down slightly as we "rise" into the sky
      const y = (s.y + skyLift * 60) % H;
      ctx.globalAlpha = a; ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(s.x, y, s.r, 0, 7); ctx.fill();
    }
    ctx.globalAlpha = 1;
    for (const w of wishStars) {
      const pulse = 1 + .25 * Math.sin(t / 400 + w.p);
      const rad = ctx.createRadialGradient(w.x, w.y, 0, w.x, w.y, 22 * pulse * w.k);
      rad.addColorStop(0, 'rgba(255,255,255,1)');
      rad.addColorStop(.15, 'rgba(255,230,160,.9)');
      rad.addColorStop(1, 'rgba(255,190,90,0)');
      ctx.fillStyle = rad; ctx.beginPath(); ctx.arc(w.x, w.y, 22 * pulse * w.k, 0, 7); ctx.fill();
      // 4-point sparkle
      ctx.strokeStyle = 'rgba(255,240,200,.8)'; ctx.lineWidth = 1;
      const L = 16 * pulse * w.k;
      ctx.beginPath(); ctx.moveTo(w.x - L, w.y); ctx.lineTo(w.x + L, w.y);
      ctx.moveTo(w.x, w.y - L); ctx.lineTo(w.x, w.y + L); ctx.stroke();
      if (w.k < 1) w.k = Math.min(1, w.k + .03);
    }
    for (let i = shooting.length - 1; i >= 0; i--) {
      const s = shooting[i]; s.x += s.vx; s.y += s.vy; s.life -= .015;
      if (s.life <= 0) { shooting.splice(i, 1); continue; }
      const grad = ctx.createLinearGradient(s.x, s.y, s.x - s.vx * 14, s.y - s.vy * 14);
      grad.addColorStop(0, `rgba(255,255,255,${s.life})`); grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.strokeStyle = grad; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - s.vx * 14, s.y - s.vy * 14); ctx.stroke();
    }
    if (Math.random() < (skyLift > .5 ? .012 : .003)) shoot();
  }
  function shoot() {
    shooting.push({ x: Math.random() * W * .8, y: Math.random() * H * .35, vx: 6 + Math.random() * 4, vy: 2 + Math.random() * 2, life: 1 });
  }
  function loop(t) { drawSky(t); requestAnimationFrame(loop); }
  requestAnimationFrame(loop);

  // ---------- Microphone blow detection ----------
  let analyser, data, listening = false, lit = true, blowMs = 0, last = 0, audioCtx, stream;
  micBtn.onclick = async () => {
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const src = audioCtx.createMediaStreamSource(stream);
      analyser = audioCtx.createAnalyser(); analyser.fftSize = 1024;
      data = new Float32Array(analyser.fftSize);
      src.connect(analyser);
      listening = true; micBtn.disabled = true; micBtn.textContent = '🎤 Micro đang nghe…';
      meter.style.visibility = 'visible';
      hint.textContent = 'Giờ hãy thổi mạnh vào micro! 💨';
      last = performance.now(); listen();
    } catch (e) {
      hint.textContent = 'Không mở được micro 😢 — chạm vào ngọn lửa để thổi nhé.';
    }
  };

  function listen() {
    if (!listening) return;
    const now = performance.now(), dt = now - last; last = now;
    analyser.getFloatTimeDomainData(data);
    let sum = 0; for (let i = 0; i < data.length; i++) sum += data[i] * data[i];
    const rms = Math.sqrt(sum / data.length);
    const level = Math.min(1, rms / 0.25);
    meterBar.style.width = (level * 100) + '%';
    if (lit) {
      // flame bends with the breath
      flame.style.transform = `skewX(${-level * 25}deg) scaleY(${1 - level * .35})`;
      flame.style.opacity = 1 - level * .4;
      if (rms > 0.12) blowMs += dt; else blowMs = Math.max(0, blowMs - dt * 1.5);
      if (blowMs > 350) blowOut();
    }
    requestAnimationFrame(listen);
  }

  cake.addEventListener('click', () => { if (lit) blowOut(); });

  // ---------- Blow out + wish flies up ----------
  function blowOut() {
    lit = false; blowMs = 0;
    flame.style.transform = ''; flame.style.opacity = '';
    cake.classList.add('out');
    glow.style.opacity = 0;
    for (let i = 0; i < 7; i++) {
      const s = document.createElement('div'); s.className = 'smoke';
      s.style.setProperty('--dx', (Math.random() * 60 - 30) + 'px');
      s.style.animationDelay = (i * .12) + 's';
      cake.appendChild(s); setTimeout(() => s.remove(), 3200);
    }
    hint.textContent = 'Phù… 🌬️';
    setTimeout(flyWish, 900);
  }

  function flyWish() {
    const r = $('.flame-box').getBoundingClientRect();
    const el = document.createElement('div'); el.className = 'flying';
    document.body.appendChild(el);
    const startY = r.top - 10;
    const target = { x: W * (.2 + Math.random() * .6), y: H * (.12 + Math.random() * .25) };
    stage.classList.add('up');
    const t0 = performance.now(), dur = 3800;
    (function step(now) {
      const p = Math.min(1, (now - t0) / dur);
      const e = p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2;
      skyLift = e;
      const x = W / 2 + (target.x - W / 2) * e + Math.sin(p * 9) * 18 * (1 - p);
      const y = startY + (target.y - startY) * e;
      const scale = 1 + Math.sin(p * Math.PI) * .6;
      el.style.left = x + 'px'; el.style.top = y + 'px';
      el.style.transform = `translate(-50%,-50%) scale(${scale})`;
      if (p < 1) requestAnimationFrame(step);
      else {
        el.remove();
        wishStars.push({ x: target.x, y: target.y, p: Math.random() * 6, k: .1 });
        for (let i = 0; i < 3; i++) setTimeout(shoot, i * 350);
        $('#finalText').textContent = '✨ Điều ước đã thành một vì sao trên trời ✨';
        final.classList.add('show');
      }
    })(t0);
  }

  $('#againBtn').onclick = () => {
    final.classList.remove('show');
    stage.classList.remove('up');
    cake.classList.remove('out');
    glow.style.opacity = 1;
    hint.textContent = listening ? 'Ước thêm điều nữa rồi thổi nhé! 💨' : 'Nhắm mắt, ước thầm một điều, rồi thổi nến nhé!';
    const t0 = performance.now();
    (function down(now) { const p = Math.min(1, (now - t0) / 2000); skyLift = 1 - p; if (p < 1) requestAnimationFrame(down); })(t0);
    setTimeout(() => { lit = true; }, 1200);
  };
})();
</script>
</body>
</html>
